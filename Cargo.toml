[package]
name = "recinit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Rootless initramfs builder for Linux"

[lib]
name = "recinit"
path = "src/lib.rs"

[[bin]]
name = "recinit"
path = "src/main.rs"
required-features = ["builder"]

[features]
default = ["builder"]
# The initramfs builder; without it the crate is only the live protocol.
builder = ["inspect", "dep:anyhow", "dep:clap", "dep:tempfile", "dep:walkdir", "dep:target-root"]
inspect = ["dep:flate2"]

[dependencies]
anyhow = { version = "1.0", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
flate2 = { version = "1", optional = true }
tempfile = { version = "3", optional = true }
walkdir = { version = "2", optional = true }
target-root = { path = "../recstrap/target-root", optional = true }

[dev-dependencies]
tempfile = "3"
