[package]
name = "recinit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Rootless initramfs builder for Linux"

[lib]
name = "recinit"
path = "src/lib.rs"

[[bin]]
name = "recinit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
tempfile = "3"
walkdir = "2"
target-root = { path = "../recstrap/target-root" }

[dev-dependencies]
tempfile = "3"
